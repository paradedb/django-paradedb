name: Test Schema Notification

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/notify_schema_failure.py
      - scripts/tests/test_notify_schema_failure.py
      - .github/workflows/schema-compat.yml
      - .github/workflows/test-schema-notification.yml
  workflow_dispatch:

concurrency:
  group: schema-notification-tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test schema issue notification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Test notification behavior
        run: python -m unittest discover -s scripts/tests -p "test_notify_schema_failure.py"
